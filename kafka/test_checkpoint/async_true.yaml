input:
  kafka:
    addresses: [localhost:9092]
    topics: [topic_52]
    consumer_group: async_true
    checkpoint_limit: 5
    auto_replay_nacks: true

pipeline: 
  processors: 
    - mutation: |
        root = content().string() + " offset=" + @kafka_offset.string()
      
    - mutation: |
        if @kafka_offset.number() == 30 {
          root = throw("reached kafka_offset 30")
        }

output:
  reject_errored:
    stdout: {}

logger: 
  level: DEBUG